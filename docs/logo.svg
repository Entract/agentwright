<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Agentwright">
  <title>Agentwright</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#306998"/>
      <stop offset="1" stop-color="#183454"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#tile)"/>
  <!-- The prompt: where you type. -->
  <polyline points="56,72 120,123 56,174" fill="none" stroke="#ffd43b" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The cursor: what answers. -->
  <line x1="143" y1="184" x2="205" y2="184" stroke="#ffffff" stroke-width="31" stroke-linecap="round"/>
</svg>
